
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do App</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <!-- ================= LOGIN / SIGNUP SECTION ================= -->

    <section id="auth-section">
        <div class="container-fluid">
            <div class="row min-vh-100 align-items-center">

                <!-- Left Side: Logo -->
                <div class="col-lg-6 text-center p-4">

                    <!-- Animated Branding -->
<div class="brand-content">

    <div class="logo-icon mb-2">✓</div>

    <h1 class="display-4 fw-bold text-primary">
        My To-Do
    </h1>

    <h5 class="text-secondary">
        Organize your tasks, manage your time!
    </h5>

</div>

                </div>

                <!-- Right Side: Login Form -->
                <div class="col-lg-5 col-md-8 mx-auto" id="signin-page">

                    <div class="card shadow border-0 p-4">

                        <h3 class="text-center fw-bold mb-4">
                            Sign In
                        </h3>

                        <form id="signin-form">

                            <div class="mb-3">
                                <label class="form-label">Username</label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="login-username"
                                    placeholder="Enter username"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password</label>

                                <div class="input-group">
                                    <input
                                        type="password"
                                        class="form-control"
                                        id="login-password"
                                        placeholder="Enter password"
                                        required
                                    >

                                    <button
                                        class="btn btn-outline-secondary"
                                        type="button"
                                        id="show-login-password"
                                    >
                                        👁
                                    </button>
                                </div>
                            </div>

                            <div class="form-check mb-3">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="remember-password"
                                >

                                <label
                                    class="form-check-label"
                                    for="remember-password"
                                >
                                    Remember Password
                                </label>
                            </div>

                            <button
                                class="btn btn-primary w-100 mb-3"
                                type="submit"
                            >
                                Sign In
                            </button>

                            <p class="text-center mb-2">
                                Don't have an account?
                            </p>

                            <button
                                class="btn btn-outline-success w-100"
                                type="button"
                                id="open-signup"
                            >
                                Sign Up
                            </button>

                        </form>

                    </div>
                </div>


                <!-- Right Side: Signup Form -->
                <div
                    class="col-lg-5 col-md-8 mx-auto d-none"
                    id="signup-page"
                >

                    <div class="card shadow border-0 p-4">

                        <h3 class="text-center fw-bold mb-4">
                            Create Account
                        </h3>

                        <form id="signup-form">

                            <div class="mb-3">
                                <input
                                    type="text"
                                    class="form-control"
                                    id="signup-username"
                                    placeholder="Username"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <input
                                    type="email"
                                    class="form-control"
                                    id="signup-email"
                                    placeholder="Email address"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <input
                                    type="tel"
                                    class="form-control"
                                    id="signup-phone"
                                    placeholder="Phone number"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <input
                                    type="password"
                                    class="form-control"
                                    id="signup-password"
                                    placeholder="Password"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <input
                                    type="password"
                                    class="form-control"
                                    id="confirm-password"
                                    placeholder="Confirm password"
                                    required
                                >
                            </div>

                            <button
                                class="btn btn-success w-100 mb-3"
                                type="submit"
                            >
                                Sign Up
                            </button>

                            <p class="text-center mb-2">
                                Already a user?
                            </p>

                            <button
                                class="btn btn-outline-primary w-100"
                                type="button"
                                id="open-signin"
                            >
                                Already User? Sign In
                            </button>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </section>


    <!-- ================= DASHBOARD SECTION ================= -->

    <section id="dashboard-section" class="d-none">

        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
            <div class="container-fluid">

                <!-- Logo -->
                <a
                    class="navbar-brand fw-bold d-flex align-items-center gap-2"
                    href="#"
                >
                    <span class="bg-white text-primary rounded px-2 py-1">
                        ✓
                    </span>

                    <span>My To-Do</span>
                </a>

                <!-- Search and Add -->
                <div class="d-flex gap-2 mx-auto navbar-search">

                    <input
                        type="search"
                        class="form-control"
                        id="search-task"
                        placeholder="Search task..."
                    >

                    <button
                        class="btn btn-light"
                        type="button"
                        id="search-btn"
                    >
                        Search
                    </button>

                    <button
                        class="btn btn-success text-nowrap"
                        type="button"
                        data-bs-toggle="modal"
                        data-bs-target="#addTaskModal"
                    >
                        + Add
                    </button>

                </div>

                <!-- Profile Dropdown -->
                <div class="dropdown ms-auto">

                    <button
                        class="btn btn-light dropdown-toggle"
                        type="button"
                        data-bs-toggle="dropdown"
                    >
                        Profile
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end">

                        <li>
                            <button
                                class="dropdown-item"
                                type="button"
                                id="profile-btn"
                            >
                                Profile
                            </button>
                        </li>

                        <li>
                            <hr class="dropdown-divider">
                        </li>

                        <li>
                            <button
                                class="dropdown-item text-danger"
                                type="button"
                                id="logout-btn"
                            >
                                Logout
                            </button>
                        </li>

                    </ul>

                </div>

            </div>
        </nav>


        <!-- Welcome Username -->
        <div class="container mt-4">

            <h4 class="fw-bold">
                Welcome,
                <span id="display-username" class="text-primary"></span>
            </h4>

            <p class="text-secondary">
                Manage your daily tasks here.
            </p>

        </div>


        <!-- ================= ADD TASK MODAL ================= -->

        <div class="modal fade" id="addTaskModal" tabindex="-1">

            <div class="modal-dialog modal-dialog-centered">

                <div class="modal-content">

                    <div class="modal-header">

                        <h5 class="modal-title fw-bold">
                            Add New Task
                        </h5>

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                        ></button>

                    </div>

                    <div class="modal-body">

                        <form id="task-form">

                            <!-- Task Name -->
                            <div class="mb-3">
                                <input
                                    type="text"
                                    class="form-control"
                                    id="task-name"
                                    placeholder="Task name..."
                                    required
                                >
                            </div>

                            <!-- Schedule and Reminder -->
                            <div class="row g-2 mb-3">

                                <div class="col-6">
                                    <label
                                        for="task-schedule"
                                        class="form-label"
                                    >
                                        Schedule
                                    </label>

                                    <input
                                        type="datetime-local"
                                        class="form-control"
                                        id="task-schedule"
                                    >
                                </div>

                                <div class="col-6">
                                    <label
                                        for="task-reminder"
                                        class="form-label"
                                    >
                                        Reminder
                                    </label>

                                    <input
                                        type="datetime-local"
                                        class="form-control"
                                        id="task-reminder"
                                    >
                                </div>

                            </div>

                            <!-- Priority -->
                            <div class="mb-3">

                                <label
                                    for="task-priority"
                                    class="form-label"
                                >
                                    Priority
                                </label>

                                <select
                                    class="form-select"
                                    id="task-priority"
                                >
                                    <option value="0">☆ No Priority</option>
                                    <option value="1">⭐ Low</option>
                                    <option value="2">⭐⭐ Medium</option>
                                    <option value="3">⭐⭐⭐ High</option>
                                </select>

                            </div>

                            <!-- Note -->
                            <div class="mb-3">

                                <label
                                    for="task-note"
                                    class="form-label"
                                >
                                    Note
                                </label>

                                <textarea
                                    class="form-control"
                                    id="task-note"
                                    rows="3"
                                    placeholder="Add a note..."
                                ></textarea>

                            </div>

                            <!-- Buttons -->
                            <div class="d-flex justify-content-end gap-2">

                                <button
                                    type="button"
                                    class="btn btn-secondary"
                                    data-bs-dismiss="modal"
                                >
                                    Cancel
                                </button>

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Add Task
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>
        </div>


        <!-- ================= TASK TABLE ================= -->

        <div class="container mt-4">

            <div class="table-responsive">

                <table
                    class="table table-bordered table-hover align-middle"
                >

                    <thead class="table-primary">
                        <tr>
                            <th>Task</th>
                            <th>Schedule</th>
                            <th>Reminder</th>
                            <th>Note</th>
                            <th>Priority</th>
                        </tr>
                    </thead>

                    <tbody id="task-list">

                    </tbody>

                </table>

            </div>

        </div>

    </section>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Custom JavaScript -->
    <script src="index.js"></script>

</body>
<!-- Animated Intro Screen -->
<div id="splash-screen">
    <div class="tagline">
        <h2>Organize your tasks</h2>
        <h2>manage your time!</h2>
    </div>
</div>
</html>
